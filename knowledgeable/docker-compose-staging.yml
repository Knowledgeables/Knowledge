services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledgeable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledgeable"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    image: ghcr.io/knowledgeables/knowledge-migrations:latest
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: knowledgeable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
    networks:
      - staging

  app:
    image: ghcr.io/knowledgeables/knowledge:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/knowledgeable?sslmode=disable
      APP_ENV: staging
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - staging

volumes:
  postgres_data_staging:

networks:
  staging:
    driver: bridge
