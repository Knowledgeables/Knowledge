services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledgeable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledgeable"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/knowledgeables/knowledge:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/knowledgeable
      APP_ENV: staging
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - staging

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key

      - name: Deploy staging
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

            set -e

            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cd ~/app

            docker compose -p staging -f docker-compose-staging.yml pull

            docker compose -p staging -f docker-compose-staging.yml up -d db

            until docker compose -p staging -f docker-compose-staging.yml exec -T db pg_isready -U postgres; do
              sleep 2
            done

            docker compose -p staging -f docker-compose-staging.yml --profile tools up \
              --abort-on-container-exit \
              --exit-code-from migrations \
              migrations

            docker compose -p staging -f docker-compose-staging.yml up -d app

          EOF