definitions:
  auth.LoginResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  auth.MeResponse:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  pages.CrawlerExistingURLsResponse:
    properties:
      count:
        type: integer
      urls:
        items:
          type: string
        type: array
    type: object
  pages.CrawlerIngestItem:
    properties:
      content:
        type: string
      language:
        $ref: '#/definitions/pages.Language'
      title:
        type: string
      url:
        type: string
    type: object
  pages.CrawlerIngestResponse:
    properties:
      received:
        type: integer
      upserted:
        type: integer
    type: object
  pages.Language:
    enum:
    - en
    - da
    type: string
    x-enum-varnames:
    - LanguageEN
    - LanguageDA
  users.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  weather.WeatherData:
    properties:
      description:
        type: string
      humidity_pct:
        type: integer
      retrieved_at:
        type: string
      temperature_c:
        type: number
      wind_speed_ms:
        type: number
    type: object
info:
  contact: {}
paths:
  /api/crawler/existing-urls:
    get:
      description: Return list of all URLs already in database
      parameters:
      - description: Crawler authentication key
        in: header
        name: X-Crawler-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pages.CrawlerExistingURLsResponse'
        "401":
          description: unauthorized
          schema:
            type: string
        "405":
          description: method not allowed
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Get existing crawler URLs
      tags:
      - crawler
  /api/crawler/ingest:
    post:
      consumes:
      - application/json
      description: Upsert crawler results into pages table
      parameters:
      - description: Crawler authentication key
        in: header
        name: X-Crawler-Key
        required: true
        type: string
      - description: Crawler pages payload
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/pages.CrawlerIngestItem'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pages.CrawlerIngestResponse'
        "400":
          description: invalid request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "405":
          description: method not allowed
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Ingest crawled pages
      tags:
      - crawler
  /api/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Authenticate user and create session
      parameters:
      - description: Username
        in: formData
        name: username
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: missing credentials or bad form data
          schema:
            type: string
        "401":
          description: invalid credentials
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Login
      tags:
      - auth
  /api/me:
    get:
      description: Returns authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MeResponse'
        "401":
          description: unauthorized
          schema:
            type: string
      summary: Get current user
      tags:
      - auth
  /api/register:
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: Register user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/users.RegisterRequest'
      produces:
      - application/json
      responses:
        "400":
          description: invalid request
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Register user
      tags:
      - auth
  /api/weather:
    get:
      description: Returns current weather for the given coordinates
      parameters:
      - description: Latitude (-90 to 90)
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude (-180 to 180)
        in: query
        name: lon
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/weather.WeatherData'
        "400":
          description: missing or invalid coordinates
          schema:
            type: string
        "502":
          description: failed to retrieve weather data
          schema:
            type: string
      summary: Get weather data
      tags:
      - weather
  /change-password:
    get:
      consumes:
      - application/x-www-form-urlencoded
      produces:
      - text/html
      - text/html
      responses:
        "200":
          description: Change password page
          schema:
            type: string
        "303":
          description: Redirect to home
          schema:
            type: string
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
      summary: Submit new password
      tags:
      - auth
      - auth
    post:
      consumes:
      - application/x-www-form-urlencoded
      produces:
      - text/html
      - text/html
      responses:
        "200":
          description: Change password page
          schema:
            type: string
        "303":
          description: Redirect to home
          schema:
            type: string
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
      summary: Submit new password
      tags:
      - auth
      - auth
  /forgot-password:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: Email address
        in: formData
        name: email
        required: true
        type: string
      produces:
      - text/html
      responses:
        "303":
          description: Redirect
          schema:
            type: string
      summary: Submit forgot password request
      tags:
      - auth
  /login:
    get:
      description: Render login page
      produces:
      - text/html
      responses:
        "200":
          description: Login page
          schema:
            type: string
        "303":
          description: Redirect to home
          schema:
            type: string
      summary: Serve Login page
      tags:
      - pages
  /logout:
    post:
      description: Deletes the current session and redirects to login page
      produces:
      - text/html
      responses:
        "303":
          description: Redirect to login page
          headers:
            Location:
              description: /login
              type: string
          schema:
            type: string
        "405":
          description: method not allowed
          schema:
            type: string
      summary: Logout user
      tags:
      - auth
  /r:
    get:
      description: Logs click event and redirects user to target URL
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Target URL
        in: query
        name: url
        required: true
        type: string
      - description: Result position
        in: query
        name: pos
        required: true
        type: integer
      responses:
        "302":
          description: Found
        "400":
          description: invalid url
          schema:
            type: string
      summary: Redirect and track search click
      tags:
      - search
  /register:
    get:
      description: Shows the register form
      produces:
      - text/html
      responses:
        "200":
          description: Register page
          schema:
            type: string
      summary: Server Register page
      tags:
      - pages
  /reset-password:
    post:
      consumes:
      - application/x-www-form-urlencoded
      produces:
      - text/html
      responses:
        "303":
          description: Redirect to login
          schema:
            type: string
      summary: Submit new password
      tags:
      - auth
  /weather:
    get:
      description: Render the weather page
      produces:
      - text/html
      responses:
        "200":
          description: Weather page
          schema:
            type: string
      summary: Serve Weather page
      tags:
      - weather
swagger: "2.0"
