name: CD - Deployment

on:
  workflow_run:
    workflows: ["CD - Delivery"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key

      - name: Deploy
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

            set -e

            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cd ~/app

            docker compose -p production -f docker-compose.yml pull

            docker compose -p production -f docker-compose.yml up -d db

            until docker compose -p production -f docker-compose.yml exec -T db pg_isready -U postgres; do
              sleep 2
            done

            docker compose -p production -f docker-compose.yml --profile tools up \
              --abort-on-container-exit \
              --exit-code-from migrations \
              migrations

            docker compose -p production -f docker-compose.yml up -d app nginx

          EOF