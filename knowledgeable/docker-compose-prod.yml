services:
  app:
    image: ghcr.io/knowledgeables/knowledge:latest
    container_name: knowledgeable
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/prod.db
      APP_ENV: production
    volumes:
      - ./data:/app/data
    networks:
      - knowledgeable_network

  nginx:
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped
    env_file: .env
    networks:
      - knowledgeable_network 
    ports:
      - 80:80
      - 443:443
    depends_on:
      - app 
    volumes:
      - ./nginx/secure/:/etc/nginx/templates/
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/99-autoreload.sh:/docker-entrypoint.d/99-autoreload.sh 

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"  # Renew certificates every 12 hours

networks:
  knowledgeable_network:
    driver: bridge