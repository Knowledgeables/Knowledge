services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - knowledgeable_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: ghcr.io/knowledgeables/knowledge-migrations:${IMAGE_TAG}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
    networks:
      - knowledgeable_network

  app:
    image: ghcr.io/knowledgeables/knowledge:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CRAWLER_KEY: ${CRAWLER_KEY:?CRAWLER_KEY is required}
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - knowledgeable_network
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:latest
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/secure/:/etc/nginx/templates/
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    networks:
      - knowledgeable_network

volumes:
  postgres_data:

networks:
  knowledgeable_network:
    driver: bridge