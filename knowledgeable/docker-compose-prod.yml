services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - knowledgeable_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/knowledgeables/knowledge:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      - db
    networks:
      - knowledgeable_network

  migrations:
    image: ghcr.io/knowledgeables/knowledge-migrations:latest
    depends_on:
      - db
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
    networks:
      - knowledgeable_network

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./nginx/secure/:/etc/nginx/templates/
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    networks:
      - knowledgeable_network

      - name: Deploy
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

            set -e

            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cd ~/app

            docker compose -p production -f docker-compose.yml pull

            docker compose -p production -f docker-compose.yml up -d db

            until docker compose -p production -f docker-compose.yml exec -T db pg_isready -U postgres; do
              sleep 2
            done

            docker compose -p production -f docker-compose.yml --profile tools up \
              --abort-on-container-exit \
              --exit-code-from migrations \
              migrations

            docker compose -p production -f docker-compose.yml up -d app nginx

          EOF