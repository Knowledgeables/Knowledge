<!DOCTYPE html>
<html>

<head>
    <title>Home</title>
    <link href="/static/output.css" rel="stylesheet">
    <link rel="icon" href="/static/favicon.png" />
</head>

<body class="min-h-screen flex flex-col">

    <nav id="navbar"
        class="flex flex-row items-center fixed top-0 left-0 w-full justify-between py-3 px-5 bg-[#090d16] z-[999]">
    </nav>


    <div
        class="relative w-screen h-screen bg-[url('/static/grid-green.svg')] bg-repeat flex items-center justify-center flex-col font-sans tracking-tight">
        <div
            class="absolute inset-x-0 bottom-0 top-16 pointer-events-none bg-[radial-gradient(ellipse_80%_80%_at_50%_50%,transparent_30%,#0a0e17_100%)]">
        </div>



        <div
            class="w-fit h-fit border-[1px] border-[#242422] flex flex-col justify-center items-center gap-14 rounded-lg p-12 z-10">

            <div class="m-5 flex items-center justify-center">


                <h1 class="text-5xl">
                    Search. <a class="text-5xl text-[#1eff8c]"> Unlock Knowledge.</a>
                </h1>
            </div>

            <div class="w-full flex gap-3">
                <input
                    id="search-input"
                    type="text"
                    placeholder="Search..."
                    class="flex-1 h-10 bg-[#0f172a] border border-gray-800 rounded px-3 text-white focus:outline-none focus:ring-2 focus:ring-gray-500" />
                <a href="/search" id="search-button" class="h-10 px-4 flex gap-2 items-center justify-center
          text-[#1eff8c]
          bg-[#1eff8c]/20
          hover:bg-[#1eff8c]/50
          transition font-semibold rounded-lg">
                    <i data-lucide="search"></i>
                    Search
                </a>
            </div>


        </div>


    </div>

    </div>



    </div>
    <footer id="about"
        class="w-full border-t border-[#242422] bg-[#0f0f0e] py-4 px-5 flex items-center justify-between text-sm text-gray-400">

        <p>© 2026 Knowledgeable</p>

        <div class="flex gap-4">

        </div>

    </footer>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="/static/js/navbarAuth.js" type="module"></script>
    <script>
        const input = document.getElementById('search-input');
        const btn = document.getElementById('search-go-button');
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                window.location.href = '/search?q=' + encodeURIComponent(input.value);
            }
        });
        btn.addEventListener('click', function(e) {
            if (input.value.trim()) {
                e.preventDefault();
                window.location.href = '/search?q=' + encodeURIComponent(input.value);
            }
        });
    </script>


</body>

</html>
