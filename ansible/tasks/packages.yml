---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  when: not ansible_check_mode

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: yes
  when: not ansible_check_mode

- name: Install base packages
  ansible.builtin.apt:
    name:
      - software-properties-common
      - ca-certificates
      - curl
      - gnupg
    state: present