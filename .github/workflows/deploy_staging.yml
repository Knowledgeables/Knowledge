name: CD - Staging Deployment

on:
  workflow_run:
    workflows: [ "CD - Delivery" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key to runner
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key

      - name: Deploy staging on server
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << "EOF"

            echo "${{ secrets.CR__PAT }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            cd ~/app

            docker compose -p staging -f docker-compose-staging.yml pull

            docker compose -p staging -f docker-compose-staging.yml up -d

            timeout 60 bash -c "until docker compose -p staging -f docker-compose-staging.yml exec -T db pg_isready -U postgres; do sleep 2; done"

            docker compose -p staging -f docker-compose-staging.yml --profile tools run --rm migrations \
              sh -e -c "npx knex migrate:latest && npx knex seed:run --specific=staging_init_data.js"

          EOF