
name: CD - Staging Deployment
on:
  workflow_run:
    workflows: [ "CD - Delivery" ]
    types: [ completed ]
    branches: [ main ]
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key


      - name: Copy compose file
        run: |
          scp -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no \
            knowledgeable/docker-compose-staging.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/docker-compose-staging.yml

      - name: Copy scripts
        run: |
          scp -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no \
            .github/scripts/deploy-staging.sh \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/deploy-staging.sh
          scp -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no \
            .github/scripts/teardown-staging.sh \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/teardown-staging.sh

      - name: Deploy staging
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "CR_PAT='${{ secrets.CR__PAT }}' DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}' CRAWLER_KEY='${{ secrets.CRAWLER_KEY }}' DATABASE_URL='${{ secrets.DATABASE_URL }}' bash ~/app/deploy-staging.sh"

      - name: Wait for staging app
        run: |
          timeout 60 bash -c 'until curl -f http://${{ secrets.SSH_HOST }}:8081/health; do sleep 2; done'

          