name: Drift Check
on:
  schedule:
    - cron: '0 3 * * *'    # 3 AM UTC daily
  workflow_dispatch:

jobs:
  ansible-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install Ansible
        run: pipx install --include-deps ansible

      - name: Create group_vars from secrets
        run: |
          mkdir -p ansible/group_vars
          cat > ansible/group_vars/all.yml << EOF
          ansible_user: ${{ secrets.SSH_USER }}
          node_exporter_version: "1.8.2"
          loki_url: ${{ secrets.LOKI_URL }}
          azure_sas_token: ${{ secrets.SAS_TOKEN }}
          EOF

      - name: Run Ansible in check mode
        id: check
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          set +e
          ansible-playbook -i inventory.ini playbook.yml --check > drift-output.txt 2>&1
          rc=$?
          set -e

          if [ $rc -ne 0 ] && (grep -qE "FAILED!|UNREACHABLE" drift-output.txt); then
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "check_failed=true" >> $GITHUB_OUTPUT
            exit 1
          elif grep -q "changed=[1-9]" drift-output.txt; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "check_failed=false" >> $GITHUB_OUTPUT
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "check_failed=false" >> $GITHUB_OUTPUT
          fi

          exit 0

      - name: Upload drift output as artifact
        if: steps.check.outputs.drift_detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-output
          path: ansible/drift-output.txt
          retention-days: 30

      - name: Open issue on drift
        if: steps.check.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
            script: |
                const fs = require('fs');
                const drift = fs.readFileSync('ansible/drift-output.txt', 'utf8');
                const truncated = drift.length > 5000
                    ? drift.substring(0, 5000) + '\n\n...(truncated, see workflow artifact for full output)'
                    : drift;

                const timestamp = new Date().toISOString();
                const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                const configureUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/configure.yml`;

                const body = [
                    '## What changed',
                    'Ansible detected that one or more VMs no longer match the declared state in `playbook.yml`.',
                    '',
                    '## Detection',
                    `- **Detected by:** [Drift Check workflow](${runUrl})`,
                    `- **Detected at:** ${timestamp}`,
                    '- **Method:** `ansible-playbook --check --diff`',
                    '',
                    '## Drift details',
                    '<details>',
                    '<summary>Output (truncated)</summary>',
                    '',
                    '```',
                    truncated,
                    '```',
                    '</details>',
                    '',
                    'Full output: see workflow run artifacts.',
                    '',
                    '## Suggested action',
                    '- [ ] Review the drift output above',
                    '- [ ] If the change is intentional → update `ansible/playbook.yml` to reflect new desired state',
                    `- [ ] If the change is unintentional → manually trigger the [Configure workflow](${configureUrl}) to reconcile`,
                    '- [ ] Investigate root cause (manual SSH? automated update? compromised host?)',
                ].join('\n');

                github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: 'drift(infra): VM configuration diverged from playbook',
                    labels: ['drift', 'infra'],
                    body,
                })