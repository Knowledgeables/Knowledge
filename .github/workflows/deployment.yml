name: CD - Deployment
on:
  workflow_run:
    workflows: ["CD - Playwright Staging E2E"]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key to runner
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key

      - name: Ensure remote app directory exists
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ~/app"

      - name: Transfer docker-compose-prod.yml to server
        run: |
          scp -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no \
            knowledgeable/docker-compose-prod.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/docker-compose.yml

      - name: Create .env file
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .env
          printf 'APP_DOMAIN=%s\n' "$APP_DOMAIN" >> .env
          printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER" >> .env
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" >> .env
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" >> .env

      - name: Transfer .env to server
        run: |
          scp -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no \
            .env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/.env

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << "EOF"
            set -euo pipefail
            echo "${{ secrets.CR__PAT }}" | docker login ghcr.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            cd ~/app
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
          EOF