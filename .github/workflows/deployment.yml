name: CD - Deployment
on:
  workflow_run:
    workflows: ["CD - Playwright Staging E2E"]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote app directory exists
        run: |
          ssh -i ~/.ssh/ssh_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ~/app"

      - name: Transfer docker-compose-prod.yml to server
        run: |
          scp -i ~/.ssh/ssh_key \
            knowledgeable/docker-compose-prod.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/docker-compose.yml

      - name: Transfer nginx config to server
        run: |
          ssh -i ~/.ssh/ssh_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ~/app/nginx/secure"
          scp -i ~/.ssh/ssh_key -r \
            knowledgeable/nginx/secure/. \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/nginx/secure/

      - name: Create .env file
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRAWLER_KEY: ${{ secrets.CRAWLER_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          umask 077
          printf 'IMAGE_TAG=%s\n'         "$IMAGE_TAG"           >  .env
          printf 'APP_DOMAIN=%s\n'        "$APP_DOMAIN"          >> .env
          printf 'POSTGRES_USER=%s\n'     "$POSTGRES_USER"       >> .env
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"   >> .env
          printf 'DATABASE_URL=%s\n'      "$DATABASE_URL"        >> .env
          printf 'CRAWLER_KEY=%s\n'       "$CRAWLER_KEY"         >> .env
          printf 'RESEND_API_KEY=%s\n'    "$RESEND_API_KEY"      >> .env
          printf 'FROM_EMAIL=%s\n'        "$FROM_EMAIL"          >> .env
          printf 'APP_BASE_URL=https://%s\n' "$APP_DOMAIN"       >> .env

      - name: Backup current env on server
        run: |
          ssh -i ~/.ssh/ssh_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << "EOF"
            set -e
            if [ -f ~/app/.env ]; then
              cp ~/app/.env ~/app/.env.previous
            fi
          EOF
          
      - name: Transfer .env to server
        run: |
          scp -i ~/.ssh/ssh_key .env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/.env
          ssh -i ~/.ssh/ssh_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "chmod 600 ~/app/.env"
          rm -f .env

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/ssh_key \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << "EOF"
            set -euo pipefail
            echo "${{ secrets.CR__PAT }}" | docker login ghcr.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            cd ~/app
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose up -d --no-deps --force-recreate nginx
            docker compose ps
          EOF

      - name: Wait for app to be ready
        run: |
          for i in {1..15}; do
            if curl -sf https://${{ secrets.APP_DOMAIN }}/health; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting..."
            sleep 5
          done

          echo "App failed to start"
          exit 1

      - name: Run Playwright post-deploy smoke
        env:
          BASE_URL: https://${{ secrets.APP_DOMAIN }}
          TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test --project=post-deploy