name: CD - Delivery

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        working-directory: knowledgeable
        run: go test ./...

      - name: Start database for migrations
        working-directory: knowledgeable
        run: docker compose -f docker-compose-dev.yml up -d db

      - name: Wait for database
        working-directory: knowledgeable
        run: |
          timeout 60 bash -c 'until docker compose -f docker-compose-dev.yml exec -T db pg_isready -U "${POSTGRES_USER:-user}"; do sleep 2; done'

      - name: Run database migrations
        working-directory: knowledgeable
        run: |
          docker compose -f docker-compose-dev.yml run --rm migrations sh -c "npm install && npx knex migrate:latest && npx knex seed:run"

      - name: Tear down migration containers
        if: always()
        working-directory: knowledgeable
        run: docker compose -f docker-compose-dev.yml down

      - name: Set up Docker Buildx
        run: docker buildx create --use

      - name: Log in to GHCR
        run: echo "${{ secrets.CR__PAT }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build and push all images
        working-directory: knowledgeable
        run: docker buildx bake -f docker-compose-build.yml --push