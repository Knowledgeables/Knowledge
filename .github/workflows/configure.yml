name: Configure - Ansible
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - '.github/workflows/configure.yml'

concurrency:
  group: configure
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.MONITOR_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          pipx install --include-deps ansible

      - name: Create group_vars from secrets
        run: |
          mkdir -p ansible/group_vars
          cat > ansible/group_vars/all.yml << EOF
          ansible_user: ${{ secrets.SSH_USER }}
          node_exporter_version: "1.8.2"
          loki_url: ${{ secrets.LOKI_URL }}
          db_sas_token: ${{ secrets.SAS_DB_TOKEN }}
          loki_sas_token: ${{ secrets.SAS_LOKI_TOKEN }}
          EOF

      - name: Run Ansible playbook
        working-directory: ansible
        run: ansible-playbook -i inventory.ini playbook.yml