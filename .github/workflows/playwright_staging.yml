name: CD - Playwright Staging E2E
on:
  workflow_run:
    workflows: [ "CD - Staging Deployment" ]
    types: [ completed ]
    branches: [ main ]
jobs:
  run-playwright-full:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key
  
      - name: Install dependencies
        working-directory: knowledgeable
        run: npm ci

      - name: Install Playwright browsers
        working-directory: knowledgeable
        run: npx playwright install --with-deps

      - name: Run e2e tests
        working-directory: knowledgeable
        run: npx playwright test --project=full --reporter=line
        env:
          BASE_URL: http://${{ secrets.SSH_HOST }}:8081

      - name: Teardown staging
        if: always()
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash ~/app/teardown-staging.sh"