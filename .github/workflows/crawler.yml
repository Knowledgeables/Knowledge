name: Crawler - Scheduled

on:
 
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: knowledgeable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install crawler dependency
        run: npm install jsdom


      - name: Run crawler
        env:
          BACKEND_URL: ${{ secrets.CRAWLER_BACKEND_URL }}
          CRAWLER_KEY: ${{ secrets.CRAWLER_KEY }}
          ENABLE_INGEST: "true"
          MAX_TARGETS: "20"
          MAX_PAGES: "100"
          MAX_DEPTH: "2"
          SEED_URL_TEMPLATES: "https://en.wikipedia.org/wiki/{query},https://www.britannica.com/search?query={query},https://developer.mozilla.org/en-US/search?q={query}"
          CRAWL_DELAY_MS: "1000"
        run: node scripts/crawler.js
