name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: knowledgeable/go.mod

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Start application
      working-directory: knowledgeable
      run: docker compose -f docker-compose-dev.yml up -d --build

    - name: Wait for app
      working-directory: knowedgeable
      run:
        timeout 60 bash -c 'until curl -f http://localhost:8080; do sleep 2; done'

    - name: Install dependencies
      working-directory: knowledgeable
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: knowledgeable
      run: npx playwright install --with-deps

    - name: Run Playwright smoke tests
      run: npx playwright test --grep @smoke
      working-directory: knowledgeable

    - name: Show running containers
      if: always()
      run: docker ps -a

    - name: Show logs
      if: always()
      working-directory: knowledgeable
      run: docker compose -f docker-compose-dev.yml logs

    - name: Upload Playwright report  
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: knowledgeable/playwright-report/
        retention-days: 30
