name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: knowledgeable/go.mod

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Start application
      working-directory: knowledgeable
      run: APP_ENV=dev docker compose -f docker-compose-dev.yml up -d --build
    
    - name: Wait for database
      working-directory: knowledgeable
      run: timeout 60 bash -c 'until docker compose -f docker-compose-dev.yml exec -T db pg_isready -U user; do sleep 2; done'
    
    - name: Run migrations + seeds
      working-directory: knowledgeable
      run: |
        docker compose -f docker-compose-dev.yml run --rm \
        -e POSTGRES_DB=knowledge \
        -e POSTGRES_USER=user \
        -e POSTGRES_PASSWORD=password \
        -e POSTGRES_HOST=db \
        migrations sh -c "npm install && npx knex migrate:latest && npx knex seed:run"

    - name: Install dependencies
      working-directory: knowledgeable
      run: npm ci

    - name: Wait for app
      working-directory: knowledgeable
      run: timeout 60 bash -c 'until curl -f http://localhost:8080; do sleep 2; done'
    


    - name: Install Playwright Browsers
      working-directory: knowledgeable
      run: npx playwright install chromium --with-deps
    
    - name: Debug login response
      run: |
        curl -i -X POST http://localhost:8080/api/login \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "username=admin&password=secret"
   
    - name: Run Playwright smoke tests
      run: npx playwright test --grep @smoke
      working-directory: knowledgeable


    
    - name: Show running containers
      if: always()
      run: docker ps -a

    - name: Show logs
      if: always()
      working-directory: knowledgeable
      run: docker compose -f docker-compose-dev.yml logs

    - name: Upload Playwright report  
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: knowledgeable/playwright-report/
        retention-days: 30
