server:
  http_listen_port: 9080
  log_level: info

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://131.163.90.7/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_path']
        target_label: '__path__'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'instance'

    pipeline_stages:
      - docker: {}

  - job_name: db-backup
    static_configs:
      - targets:
          - localhost
        labels:
          job: db-backup
          __path__: /opt/db_backups/db_backup.log
